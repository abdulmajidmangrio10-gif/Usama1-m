name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          JAVA_VER=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | awk -F '.' '{print ($1 == 1 ? $2 : $1)}')
          echo "Detected Java major version: $JAVA_VER"
          if [ -z "$JAVA_VER" ]; then
            echo "Error: Java major version could not be detected."
            exit 1
          fi
          if [ "$JAVA_VER" -lt 17 ]; then
            echo "Error: Java version must be 17 or newer. Detected: $JAVA_VER"
            exit 1
          fi

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ ! -f ./debug.keystore ]; then
            echo "Generating debug.keystore..."
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          else
            echo "debug.keystore already exists."
          fi
          if [ ! -f ./debug.keystore ]; then
            echo "Error: debug.keystore could not be found or created."
            exit 1
          fi

      - name: Build Debug APK
        run: |
          gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        run: |
          if [ ! -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "Error: app-debug.apk was not found!"
            find app/build/outputs -type f -name "*.apk" || true
            exit 1
          fi
          echo "APK successfully built:"
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: latest
          name: "Latest Debug Build"
          body: "Automatic build of debug APK generated by GitHub Actions."
          files: app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
